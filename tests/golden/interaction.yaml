# Hand-labeled golden set for the interaction matcher.
# Tags used here are ONLY the eleven interaction-domain tags.
cards:
  # ---------------------------------------------------------------- spot: creature
  - name: Swords to Plowshares
    mana_cost: "{W}"
    mana_value: 1
    type_line: Instant
    oracle_text: |
      Exile target creature. Its controller gains life equal to its power.
    expect: [removal.spot.creature]
    forbid: [removal.spot.any, wipe.creature]

  - name: Path to Exile
    mana_cost: "{W}"
    mana_value: 1
    type_line: Instant
    oracle_text: |
      Exile target creature. Its controller may search their library for a basic land card, put that card onto the battlefield tapped, then shuffle.
    expect: [removal.spot.creature]
    forbid: [theft, removal.spot.any]

  - name: Murder
    mana_cost: "{1}{B}{B}"
    mana_value: 3
    type_line: Instant
    oracle_text: |
      Destroy target creature.
    expect: [removal.spot.creature]
    forbid: [removal.spot.any]

  - name: Pongify
    mana_cost: "{U}"
    mana_value: 1
    type_line: Instant
    oracle_text: |
      Destroy target creature. It can't be regenerated. That creature's controller creates a 3/3 green Ape creature token.
    expect: [removal.spot.creature]
    forbid: [stax]

  - name: Diabolic Edict
    mana_cost: "{1}{B}"
    mana_value: 2
    type_line: Instant
    oracle_text: |
      Target player sacrifices a creature.
    expect: [removal.spot.creature]
    forbid: [wipe.creature, stax]

  - name: Prey Upon
    mana_cost: "{G}"
    mana_value: 1
    type_line: Sorcery
