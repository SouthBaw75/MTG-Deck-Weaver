# Golden cards for the mana domain (ramp, cost reduction, fixing, utility lands).
#
# Encoding decisions mirrored by src/weaver/knowledge/matchers/mana.py:
#   - land fetched ONTO the battlefield by a nonland card  -> ramp.land
#   - land tutored TO HAND (Land Tax, Weathered Wayfarer)  -> mana-fixing only
#   - a LAND fetching lands (Evolving Wilds)               -> mana-fixing, not ramp.land
#   - Treasure creation (Smothering Tithe)                 -> engine domain, never ramp.rock
#   - ETB one-shot mana on a creature (Priest of Gix)      -> neither ramp.dork nor ramp.ritual

