# Golden cards for the defense_offense matcher domain.
# expect/forbid use ONLY tags owned by this domain:
#   protection.self, protection.board, fog, pillow-fort, deterrent, lifegain,
#   blocker.value, wincon.combat, wincon.alt, evasion-granting, buff.anthem,
#   extra-combat, extra-turn, burn
cards:
