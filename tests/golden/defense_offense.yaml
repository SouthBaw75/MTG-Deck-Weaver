  - name: "Lightning Greaves"
    mana_cost: "{2}"
    mana_value: 2
    type_line: "Artifact — Equipment"
    oracle_text: |
      Equipped creature has haste and shroud.
      Equip {0}
    expect: [protection.self]
    forbid: [protection.board]

  - name: "Swiftfoot Boots"
    mana_cost: "{2}"
    mana_value: 2
    type_line: "Artifact — Equipment"
    oracle_text: |
      Equipped creature has hexproof and haste.
      Equip {1}
