# Hand-labeled golden set for the card_advantage matcher domain.
# Tags used here (expect/forbid) are ONLY: draw.burst, draw.engine,
# impulse-draw, wheel, recursion, tutor.broad, tutor.narrow.

cards:
  # ---------------- draw.burst ------------------------------------------
  - name: Harmonize
    mana_cost: "{3}{G}"
    mana_value: 4
    type_line: Sorcery
    oracle_text: Draw three cards.
    expect: [draw.burst]

  - name: Night's Whisper
    mana_cost: "{1}{B}"
    mana_value: 2
    type_line: Sorcery
    oracle_text: You draw two cards and you lose 2 life.
    expect: [draw.burst]

  - name: Sign in Blood
    mana_cost: "{B}{B}"
    mana_value: 2
    type_line: Sorcery
    oracle_text: Target player draws two cards and loses 2 life.
    expect: [draw.burst]

  - name: Divination
    mana_cost: "{2}{U}"
    mana_value: 3
    type_line: Sorcery
    oracle_text: Draw two cards.
    expect: [draw.burst]

  - name: Concentrate
    mana_cost: "{2}{U}{U}"
    mana_value: 4
    type_line: Sorcery
    oracle_text: Draw three cards.
    expect: [draw.burst]

  - name: Treasure Cruise
    mana_cost: "{7}{U}"
    mana_value: 8
    type_line: Sorcery
    oracle_text: |
      Delve
      Draw three cards.
    keywords: [Delve]
    expect: [draw.burst]

  - name: Mulldrifter
    mana_cost: "{4}{U}"
    mana_value: 5
    type_line: Creature — Elemental
    power: 2
    toughness: 2
    oracle_text: |
      Flying
      When Mulldrifter enters the battlefield, draw two cards.
      Evoke {2}{U}
    keywords: [Flying, Evoke]
    expect: [draw.burst]
    forbid: [draw.engine]

  - name: Fact or Fiction
    mana_cost: "{3}{U}"
    mana_value: 4
    type_line: Instant
    oracle_text: Reveal the top five cards of your library. An opponent separates those cards into two piles. Put one pile into your hand and the other into your graveyard.
    expect: [draw.burst]

  - name: Blue Sun's Zenith
    mana_cost: "{X}{U}{U}{U}"
    mana_value: 3
    type_line: Instant
    oracle_text: Target player draws X cards. Shuffle Blue Sun's Zenith into its owner's library.
    expect: [draw.burst]
    forbid: [wheel]

  - name: Painful Truths
    mana_cost: "{1}{B}{B}"
    mana_value: 3
    type_line: Sorcery
    oracle_text: Converge — You draw X cards and you lose X life, where X is the number of colors of mana spent to cast this spell.
    expect: [draw.burst]

  # ---------------- draw.engine -----------------------------------------
  - name: Rhystic Study
    mana_cost: "{2}{U}"
    mana_value: 3
    type_line: Enchantment
    oracle_text: Whenever an opponent casts a spell, you may draw a card unless that player pays {1}.
    expect: [draw.engine]
    forbid: [draw.burst]

  - name: Phyrexian Arena
    mana_cost: "{1}{B}{B}"
    mana_value: 3
    type_line: Enchantment
    oracle_text: At the beginning of your upkeep, you draw a card and you lose 1 life.
    expect: [draw.engine]
    forbid: [draw.burst]

  - name: Beast Whisperer
    mana_cost: "{2}{G}{G}"
    mana_value: 4
    type_line: Creature — Elf Druid
    power: 2
    toughness: 3
    oracle_text: Whenever you cast a creature spell, draw a card.
    expect: [draw.engine]

  - name: Guardian Project
    mana_cost: "{3}{G}"
    mana_value: 4
    type_line: Enchantment
    oracle_text: Whenever a nontoken creature you control enters, if it doesn't have the same name as another creature you control or a creature card in your graveyard, draw a card.
    expect: [draw.engine]

  - name: Esper Sentinel
    mana_cost: "{W}"
    mana_value: 1
    type_line: Artifact Creature — Human Soldier
    power: 1
    toughness: 1
    oracle_text: Whenever an opponent casts their first noncreature spell each turn, draw a card unless that spell's controller pays {X}, where X is Esper Sentinel's power.
    expect: [draw.engine]

  - name: Black Market Connections
    mana_cost: "{2}{B}"
    mana_value: 3
    type_line: Enchantment
    oracle_text: |
      At the beginning of your precombat main phase, choose one or more —
      • Sell Contraband — Create a Treasure token. You lose 1 life.
      • Buy Information — You draw a card. You lose 2 life.
      • Hire a Mercenary — Create a 3/2 colorless Shapeshifter creature token with changeling. You lose 3 life.
    expect: [draw.engine]

  - name: Sylvan Library
    mana_cost: "{1}{G}"
    mana_value: 2
    type_line: Enchantment
    oracle_text: At the beginning of your draw step, you may draw two additional cards. If you do, choose two cards in your hand drawn this turn. For each of those cards, pay 4 life or put the card on top of your library.
    expect: [draw.engine]
    forbid: [draw.burst]

  - name: Jayemdae Tome
    mana_cost: "{4}"
    mana_value: 4
    type_line: Artifact
    oracle_text: "{4}, {T}: Draw a card."
    expect: [draw.engine]
    forbid: [draw.burst]

  - name: Mind's Eye
    mana_cost: "{5}"
    mana_value: 5
    type_line: Artifact
    oracle_text: Whenever an opponent draws a card, you may pay {1}. If you do, draw a card.
    expect: [draw.engine]

  - name: Toski, Bearer of Secrets
    mana_cost: "{3}{G}"
    mana_value: 4
    type_line: Legendary Creature — Squirrel
    power: 1
    toughness: 1
    oracle_text: |
      This spell can't be countered.
      Indestructible
      Toski, Bearer of Secrets attacks each combat if able.
      Whenever a creature you control deals combat damage to a player, draw a card.
    keywords: [Indestructible]
    expect: [draw.engine]

  # ---------------- impulse-draw ----------------------------------------
  - name: Outpost Siege
    mana_cost: "{3}{R}"
    mana_value: 4
    type_line: Enchantment
    oracle_text: |
      As Outpost Siege enters the battlefield, choose Khans or Dragons.
      • Khans — At the beginning of your upkeep, exile the top card of your library. Until end of turn, you may play that card.
      • Dragons — Whenever a creature you control leaves the battlefield, Outpost Siege deals 1 damage to any target.
    expect: [impulse-draw]

  - name: Valakut Exploration
    mana_cost: "{2}{R}"
    mana_value: 3
    type_line: Enchantment
    oracle_text: |
      Whenever a land you control enters, exile the top card of your library. You may play that card for as long as it remains exiled.
      At the beginning of your end step, if there are cards exiled with Valakut Exploration, put them into their owner's graveyard, then Valakut Exploration deals that much damage to each opponent.
    expect: [impulse-draw]

  - name: Prosper, Tome-Bound
    mana_cost: "{2}{B}{R}"
    mana_value: 4
    type_line: Legendary Creature — Tiefling Warlock
    power: 1
    toughness: 4
    oracle_text: |
      Deathtouch
      Mystic Arcanum — At the beginning of your end step, exile the top card of your library. Until the end of your next turn, you may play that card.
      Pact Boon — Whenever you play a card from exile, create a Treasure token.
    keywords: [Deathtouch]
    expect: [impulse-draw]

  - name: Light Up the Stage
    mana_cost: "{2}{R}"
    mana_value: 3
    type_line: Sorcery
    oracle_text: |
      Spectacle {R}
      Exile the top two cards of your library. Until the end of your next turn, you may play those cards.
    keywords: [Spectacle]
    expect: [impulse-draw]
    forbid: [draw.burst]

  - name: Commune with Lava
    mana_cost: "{X}{R}{R}"
    mana_value: 2
    type_line: Instant
    oracle_text: Exile the top X cards of your library. Until the end of your next turn, you may play those cards.
    expect: [impulse-draw]

  # ---------------- wheel -------------------------------------------------
  - name: Wheel of Fortune
    mana_cost: "{2}{R}"
    mana_value: 3
    type_line: Sorcery
    oracle_text: Each player discards their hand, then draws seven cards.
    expect: [wheel]
    forbid: [draw.burst]

  - name: Windfall
    mana_cost: "{2}{U}"
    mana_value: 3
    type_line: Sorcery
    oracle_text: Each player discards their hand, then draws cards equal to the greatest number of cards a player discarded this way.
    expect: [wheel]
    forbid: [draw.burst]

  - name: Timetwister
    mana_cost: "{2}{U}"
    mana_value: 3
    type_line: Sorcery
    oracle_text: Each player shuffles their hand and graveyard into their library, then draws seven cards.
    expect: [wheel]
    forbid: [draw.burst]

  - name: Echo of Eons
    mana_cost: "{4}{U}{U}"
    mana_value: 6
    type_line: Sorcery
    oracle_text: |
      Flashback {2}{U}
      Each player shuffles their hand and graveyard into their library, then draws seven cards.
    keywords: [Flashback]
    expect: [wheel]
    forbid: [draw.burst]

  # ---------------- recursion ---------------------------------------------
  - name: Regrowth
    mana_cost: "{1}{G}"
    mana_value: 2
    type_line: Sorcery
    oracle_text: Return target card from your graveyard to your hand.
    expect: [recursion]

  - name: Eternal Witness
    mana_cost: "{1}{G}{G}"
    mana_value: 3
    type_line: Creature — Human Shaman
    power: 2
    toughness: 1
    oracle_text: When Eternal Witness enters the battlefield, you may return target card from your graveyard to your hand.
    expect: [recursion]

  - name: Reanimate
    mana_cost: "{B}"
    mana_value: 1
    type_line: Sorcery
    oracle_text: Put target creature card from a graveyard onto the battlefield under your control. You lose life equal to its mana value.
    expect: [recursion]

  - name: Animate Dead
    mana_cost: "{1}{B}"
    mana_value: 2
    type_line: Enchantment — Aura
    oracle_text: |
      Enchant creature card in a graveyard
      When Animate Dead enters the battlefield, if it's on the battlefield, it loses "enchant creature card in a graveyard" and gains "enchant creature put onto the battlefield with Animate Dead." Return enchanted creature card to the battlefield under your control and attach Animate Dead to it. When Animate Dead leaves the battlefield, that creature's controller sacrifices it.
      Enchanted creature gets -1/-0.
    expect: [recursion]

  - name: Sun Titan
    mana_cost: "{4}{W}{W}"
    mana_value: 6
    type_line: Creature — Giant
    power: 6
    toughness: 6
    oracle_text: |
      Vigilance
      Whenever Sun Titan enters the battlefield or attacks, you may return target permanent card with mana value 2 or less from your graveyard to the battlefield.
    keywords: [Vigilance]
    expect: [recursion]

  - name: Archaeomancer
    mana_cost: "{2}{U}{U}"
    mana_value: 4
    type_line: Creature — Human Wizard
    power: 1
    toughness: 2
