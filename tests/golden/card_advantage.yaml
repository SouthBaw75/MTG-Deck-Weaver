    forbid: [tutor.broad]

  # ---------------- tricky negatives ---------------------------------------
  - name: Ponder
    mana_cost: "{U}"
    mana_value: 1
    type_line: Sorcery
    oracle_text: |
      Look at the top three cards of your library, then put them back in any order. You may shuffle your library.
      Draw a card.
    forbid: [draw.burst, draw.engine, impulse-draw, tutor.broad, tutor.narrow]

  - name: Opt
    mana_cost: "{U}"
    mana_value: 1
    type_line: Instant
    oracle_text: |
      Scry 1.
      Draw a card.
    keywords: [Scry]
    forbid: [draw.burst, draw.engine]

  - name: Merfolk Looter
    mana_cost: "{1}{U}"
    mana_value: 2
    type_line: Creature — Merfolk Rogue
    power: 1
    toughness: 1
